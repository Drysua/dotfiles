# Custom mpv key bindings
# Windows location: %APPDATA%\mpv\input.conf

# Seek backward / forward exactly 5 seconds
j seek -5 exact
l seek 5 exact
о seek -5 exact
д seek 5 exact

# Pause / resume
k cycle pause
л cycle pause

# Playback speed: change by 0.1x per press
d add speed 0.1
s add speed -0.1
в add speed 0.1
ы add speed -0.1

# Toggle subtitle visibility
n cycle sub-visibility
т cycle sub-visibility

# Toggle picture-in-picture style mode:
# - stay on top of other windows
# - switch between half-size and normal-size window
i cycle ontop; cycle-values window-scale 0.5 1.0
ш cycle ontop; cycle-values window-scale 0.5 1.0

TAB script-binding stats/display-stats-toggle
